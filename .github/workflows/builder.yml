name: Build RobDroid APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      app_id:
        description: 'Rob Run Steam App ID'
        required: true
        default: '4262460'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK Packages
        run: |
          set -e
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name "sdkmanager" -type f | head -n 1)
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Install DepotDownloader CLI
        run: |
          mkdir -p "$HOME/.local/bin/depotdownloader"
          curl -fsSL "https://api.github.com/repos/SteamRE/DepotDownloader/releases/latest" \
            | grep -oE "https://[^\"]+DepotDownloader-linux-x64[^\"]*\.zip" \
            | head -n 1 \
            | xargs -r curl -fsSL -o /tmp/dd.zip
          if [ -s /tmp/dd.zip ]; then
            unzip -qo /tmp/dd.zip -d "$HOME/.local/bin/depotdownloader"
            chmod +x "$HOME/.local/bin/depotdownloader/DepotDownloader" 2>/dev/null || true
            echo "$HOME/.local/bin/depotdownloader" >> "$GITHUB_PATH"
          else
            echo "DepotDownloader release archive not found; continuing APK build."
          fi

      - name: Build RobDroid.apk
        run: |
          set -e
          cd android-project
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi
          mkdir -p app/build/outputs/apk/debug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/RobDroid.apk

      - name: Upload RobDroid.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RobDroid-APK
          path: android-project/app/build/outputs/apk/debug/RobDroid.apk
